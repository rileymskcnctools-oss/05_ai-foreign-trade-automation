{% extends "base.html" %}
{% block title %}产品管理 - FT Workspace{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">📦 产品管理</h1>
        <p class="text-sm text-gray-500 mt-1">
            <span id="product-count">{{ products|length }}</span> products
        </p>
    </div>
    <div class="flex gap-3">
        <a href="/products/api/export/csv"
           class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-medium">
            ⬇️ 导出 CSV
        </a>
        <button onclick="document.getElementById('new-product-modal').classList.remove('hidden')"
                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors text-sm font-medium">
            + 新增产品
        </button>
    </div>
</div>

<!-- 搜索栏 (HTMX 实时搜索) -->
<div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
    <form id="search-form" class="flex gap-3">
        <input type="text" name="q" value="{{ query }}" id="search-input"
               placeholder="搜索产品编码/名称..."
               hx-get="/products/partials/table"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#product-table-container"
               hx-indicator="#search-spinner"
               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none">
        <select name="category" id="category-select"
                hx-get="/products/partials/table"
                hx-trigger="change"
                hx-target="#product-table-container"
                hx-include="#search-input"
                hx-indicator="#search-spinner"
                class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
            <option value="">全部分类</option>
            {% for cat in categories %}
            <option value="{{ cat.category }}" {{ 'selected' if selected_category == cat.category }}>{{ cat.category }} ({{ cat.product_count }})</option>
            {% endfor %}
        </select>
        <div class="relative">
            <button type="button" class="px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors"
                    hx-get="/products/partials/table"
                    hx-target="#product-table-container"
                    hx-include="#search-input, #category-select"
                    hx-indicator="#search-spinner">
                搜索
            </button>
            <!-- HTMX 加载指示器 -->
            <div id="search-spinner" class="htmx-indicator absolute -right-8 top-2">
                <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
        </div>
    </form>
</div>

<!-- 产品表格 (HTMX 替换区域) -->
<div id="product-table-container">
    {% include "components/product_table.html" %}
</div>

<!-- 新增产品弹窗 -->
<div id="new-product-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="document.getElementById('new-product-modal').classList.add('hidden')"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-white rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold">📦 新增产品</h2>
            <button onclick="document.getElementById('new-product-modal').classList.add('hidden')"
                    class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <form id="new-product-form" class="p-6" onsubmit="saveNewProduct(event)">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-xs text-gray-500 mb-1">产品编码 *</label>
                    <input type="text" name="product_code" required placeholder="如 AX-099"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">英文名 *</label>
                    <input type="text" name="product_name_en" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">中文名</label>
                    <input type="text" name="product_name_cn"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">分类 *</label>
                    <input type="text" name="category" required placeholder="如 Garden Tools"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">材质</label>
                    <input type="text" name="material"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">颜色</label>
                    <input type="text" name="color" placeholder="如 Red, Blue"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">重量(kg)</label>
                    <input type="number" name="weight_kg" step="any"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">MOQ</label>
                    <input type="number" name="moq"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">包装方式</label>
                    <input type="text" name="packaging_type"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-xs text-gray-500 mb-1">📐 产品规格 (多行)</label>
                <textarea name="specifications" rows="4"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none font-mono"
                          placeholder="Head: 4-tine, 15×10cm&#10;Handle: Wood, 30cm"></textarea>
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-200">
                <button type="button" onclick="document.getElementById('new-product-modal').classList.add('hidden')"
                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">取消</button>
                <button type="submit"
                        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">💾 保存产品</button>
            </div>
        </form>
    </div>
</div>

<!-- 产品详情弹窗 (HTMX 动态加载) -->
<div id="product-detail-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeModal()"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-xl bg-white shadow-2xl overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold" id="modal-title">产品详情</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div id="product-detail-content" class="p-6">
            <!-- HTMX 动态填充 -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ========== 新增产品 ==========
function saveNewProduct(e) {
    e.preventDefault();
    const form = document.getElementById('new-product-form');
    const formData = new FormData(form);
    const data = {};
    for (const [key, val] of formData.entries()) {
        if (val !== '') {
            if (['weight_kg', 'moq'].includes(key)) {
                data[key] = parseFloat(val);
            } else {
                data[key] = val;
            }
        }
    }
    if (!data.product_code || !data.product_name_en || !data.category) {
        showToast('请填写必填字段: 编码、英文名、分类', 'error');
        return;
    }
    fetch('/products/api/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            showToast('✅ 产品创建成功!');
            document.getElementById('new-product-modal').classList.add('hidden');
            form.reset();
            setTimeout(() => location.reload(), 500);
        } else {
            showToast('❌ ' + (result.error || '创建失败'), 'error');
        }
    })
    .catch(err => showToast('❌ 请求失败: ' + err.message, 'error'));
}

// ========== 删除产品 ==========
function deleteProduct(code, name) {
    if (!confirm(`确定要删除产品 "${code} - ${name}" 吗？\n\n此操作不可撤销。`)) return;
    fetch(`/products/api/${code}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                showToast(`✅ 已删除产品 ${code}`);
                setTimeout(() => location.reload(), 500);
            } else {
                showToast('❌ 删除失败: ' + (result.error || ''), 'error');
            }
        })
        .catch(err => showToast('❌ 请求失败', 'error'));
}

function openProductDetail(productCode) {
    const modal = document.getElementById('product-detail-modal');
    modal.classList.remove('hidden');
    document.getElementById('modal-title').textContent = '加载中...';
    document.getElementById('product-detail-content').innerHTML = '<p class="text-gray-400">加载中...</p>';

    fetch(`/products/api/${productCode}`)
        .then(r => r.json())
        .then(p => {
            document.getElementById('modal-title').textContent = p.product_name_en || p.product_code;
            document.getElementById('product-detail-content').innerHTML = buildDetailHTML(p);
        })
        .catch(() => {
            document.getElementById('product-detail-content').innerHTML = '<p class="text-red-500">加载失败</p>';
        });
}

// 可编辑字段定义 (label, field, type)
const EDITABLE_FIELDS = [
    {label:'英文名', field:'product_name_en', type:'text'},
    {label:'中文名', field:'product_name_cn', type:'text'},
    {label:'分类', field:'category', type:'text'},
    {label:'子分类', field:'sub_category', type:'text'},
    {label:'材质', field:'material', type:'text'},
    {label:'手柄材质', field:'handle_material', type:'text'},
    {label:'颜色', field:'color', type:'text'},
    {label:'重量(kg)', field:'weight_kg', type:'number'},
    {label:'头宽(cm)', field:'head_width_cm', type:'number'},
    {label:'齿数', field:'tine_count', type:'number'},
    {label:'硬度', field:'hardness', type:'text'},
    {label:'表面处理', field:'surface_treatment', type:'text'},
    {label:'MOQ', field:'moq', type:'number'},
    {label:'包装方式', field:'packaging_type', type:'text'},
    {label:'每箱数量', field:'qty_per_carton', type:'number'},
    {label:'箱规(cm)', field:'carton_size_cm', type:'text'},
    {label:'箱毛重(kg)', field:'gw_per_carton_kg', type:'number'},
    {label:'交期(天)', field:'lead_time_days', type:'number'},
    {label:'认证', field:'certification', type:'text'},
    {label:'关键词', field:'target_keywords', type:'text'},
    {label:'使用场景', field:'use_scenario', type:'text'},
    {label:'目标市场', field:'target_markets', type:'text'},
    {label:'卖点角度', field:'selling_angle', type:'text'},
    {label:'竞品参考', field:'competitor_ref', type:'text'},
    {label:'HS编码', field:'hs_code', type:'text'},
    {label:'20ft装柜量', field:'loading_qty_20ft', type:'number'},
    {label:'40ft装柜量', field:'loading_qty_40ft', type:'number'},
    {label:'40HQ装柜量', field:'loading_qty_40hq', type:'number'},
    {label:'尺寸图路径', field:'dimensions_image', type:'text'},
];

function buildDetailHTML(p) {
    return `
    <div id="detail-view-mode" class="space-y-6">
        <!-- 编辑按钮 -->
        <div class="flex justify-end">
            <button onclick="switchToEdit('${p.product_code}')"
                    class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-medium">
                ✏️ 编辑产品
            </button>
        </div>

        <!-- 基本信息(只读展示) -->
        <div class="grid grid-cols-2 gap-4">
            <div><label class="text-xs text-gray-500 uppercase">编码</label><p class="text-sm font-medium">${p.product_code}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">状态</label><p class="text-sm">${p.status || 'active'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">英文名</label><p class="text-sm">${p.product_name_en || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">中文名</label><p class="text-sm">${p.product_name_cn || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">分类</label><p class="text-sm">${p.category || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">材质</label><p class="text-sm">${p.material || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">颜色</label><p class="text-sm">${p.color || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">重量</label><p class="text-sm">${p.weight_kg || '-'} kg</p></div>
            <div><label class="text-xs text-gray-500 uppercase">MOQ</label><p class="text-sm">${p.moq || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">交期</label><p class="text-sm">${p.lead_time_days || '-'} 天</p></div>
            <div><label class="text-xs text-gray-500 uppercase">包装</label><p class="text-sm">${p.packaging_type || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">每箱数量</label><p class="text-sm">${p.qty_per_carton || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">箱规</label><p class="text-sm">${p.carton_size_cm || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">表面处理</label><p class="text-sm">${p.surface_treatment || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">HS编码</label><p class="text-sm">${p.hs_code || '-'}</p></div>
            <div><label class="text-xs text-gray-500 uppercase">认证</label><p class="text-sm">${p.certification || '-'}</p></div>
        </div>

        ${p.target_keywords ? `<div class="border-t border-gray-200 pt-3"><label class="text-xs text-gray-500 uppercase">关键词</label><p class="text-sm">${p.target_keywords}</p></div>` : ''}
        ${p.specifications ? `<div class="border-t border-gray-200 pt-3"><label class="text-xs text-gray-500 uppercase">📐 产品规格</label><pre class="text-sm text-gray-700 whitespace-pre-wrap font-sans mt-1 bg-gray-50 rounded-lg p-3">${p.specifications}</pre></div>` : ''}
        ${p.dimensions_image ? `<div class="border-t border-gray-200 pt-3"><label class="text-xs text-gray-500 uppercase">尺寸图</label><p class="text-sm text-primary-600">${p.dimensions_image}</p></div>` : ''}
        ${p.selling_points ? `
        <div class="border-t border-gray-200 pt-3">
            <label class="text-xs text-gray-500 uppercase">✨ 卖点</label>
            <div class="mt-2 bg-gray-50 rounded-lg p-4 space-y-3 text-sm text-gray-700 leading-relaxed selling-points">${formatSellingPoints(p.selling_points)}</div>
        </div>` : ''}

        <!-- AI 内容生成按钮 -->
        <div class="border-t border-gray-200 pt-4">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">🤖 AI 内容生成</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="generateContent('${p.product_code}', 'seo')" class="px-3 py-2 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 text-sm font-medium" id="btn-seo">📝 SEO 标题</button>
                <button onclick="generateContent('${p.product_code}', 'selling_points')" class="px-3 py-2 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 text-sm font-medium" id="btn-selling">✨ 卖点提炼</button>
                <button onclick="generateContent('${p.product_code}', 'whatsapp')" class="px-3 py-2 bg-emerald-50 text-emerald-700 rounded-lg hover:bg-emerald-100 text-sm font-medium" id="btn-whatsapp">💬 WhatsApp 话术</button>
                <button onclick="generateContent('${p.product_code}', 'alibaba')" class="px-3 py-2 bg-orange-50 text-orange-700 rounded-lg hover:bg-orange-100 text-sm font-medium" id="btn-alibaba">🏪 阿里巴巴详情</button>
            </div>
            <div id="ai-result" class="mt-4 hidden">
                <div class="bg-gray-50 rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="text-sm font-medium" id="ai-result-title">结果</h4>
                        <button onclick="copyAiResult()" class="text-xs text-primary-600 hover:text-primary-800">📋 复制</button>
                    </div>
                    <pre id="ai-result-text" class="text-sm text-gray-700 whitespace-pre-wrap font-sans"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑模式(默认隐藏) -->
    <div id="detail-edit-mode" class="hidden">
        <form id="edit-product-form" onsubmit="saveProduct(event, '${p.product_code}')">
            <div class="grid grid-cols-2 gap-4">
                ${EDITABLE_FIELDS.map(f => `
                <div>
                    <label class="block text-xs text-gray-500 mb-1">${f.label}</label>
                    <input type="${f.type}" name="${f.field}" value="${p[f.field] ?? ''}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none"
                           ${f.type==='number' ? 'step="any"' : ''}>
                </div>
                `).join('')}
            </div>
            <!-- 规格(多行文本框) -->
            <div class="mt-4">
                <label class="block text-xs text-gray-500 mb-1">📐 产品规格 (多行)</label>
                <textarea name="specifications" rows="6"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none font-mono"
                          placeholder="Head: 4-tine, 15×10cm&#10;Handle: Wood, 30cm&#10;Total: 42cm&#10;Weight: 0.8kg">${p.specifications ?? ''}</textarea>
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-200">
                <button type="button" onclick="switchToView('${p.product_code}')"
                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">取消</button>
                <button type="submit"
                        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">💾 保存修改</button>
            </div>
        </form>
    </div>`;
}

function switchToEdit(code) {
    document.getElementById('detail-view-mode').classList.add('hidden');
    document.getElementById('detail-edit-mode').classList.remove('hidden');
    document.getElementById('modal-title').textContent = '编辑: ' + code;
}

function switchToView(code) {
    // 重新加载最新数据
    openProductDetail(code);
}

function saveProduct(e, code) {
    e.preventDefault();
    const form = document.getElementById('edit-product-form');
    const formData = new FormData(form);
    const data = {};
    for (const [key, val] of formData.entries()) {
        if (val !== '') {
            // 数字字段转数字
            const fieldDef = EDITABLE_FIELDS.find(f => f.field === key);
            if (fieldDef && fieldDef.type === 'number') {
                data[key] = parseFloat(val);
            } else {
                data[key] = val;
            }
        }
    }

    fetch(`/products/api/${code}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            showToast('✅ 产品信息已更新');
            openProductDetail(code); // 回到查看模式并刷新数据
        } else {
            showToast('❌ 更新失败: ' + (result.error || ''), 'error');
        }
    })
    .catch(err => showToast('❌ 请求失败: ' + err.message, 'error'));
}

function closeModal() {
    document.getElementById('product-detail-modal').classList.add('hidden');
}

function generateContent(productCode, type) {
    const btn = document.getElementById(`btn-${type === 'selling_points' ? 'selling' : type}`);
    const origText = btn.textContent;
    btn.textContent = '⏳ 生成中...';
    btn.disabled = true;

    document.getElementById('ai-result').classList.remove('hidden');
    document.getElementById('ai-result-title').textContent = '生成中...';
    document.getElementById('ai-result-text').textContent = '请稍候，AI 正在生成内容...';

    fetch(`/products/api/${productCode}/generate/${type}`)
        .then(r => r.json())
        .then(data => {
            btn.textContent = origText;
            btn.disabled = false;
            if (data.success) {
                document.getElementById('ai-result-title').textContent = `✅ ${origText.trim()}`;
                const content = typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
                document.getElementById('ai-result-text').textContent = content;
            } else {
                document.getElementById('ai-result-text').textContent = '生成失败: ' + (data.error || '未知错误');
            }
        })
        .catch(err => {
            btn.textContent = origText;
            btn.disabled = false;
            document.getElementById('ai-result-text').textContent = '请求失败: ' + err.message;
        });
}

function copyAiResult() {
    const text = document.getElementById('ai-result-text').textContent;
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}

// ESC 关闭弹窗
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
});

// 格式化卖点文本: **粗体** → <b>, 换行 → <br>, 段落分隔
function formatSellingPoints(text) {
    if (!text) return '';
    return text
        // **bold** → <b>bold</b>
        .replace(/\*\*(.+?)\*\*/g, '<span class="font-semibold text-gray-900 block text-base mb-1">$1</span>')
        // 换行分段: 连续两个换行 = 段落分隔
        .split(/\n\s*\n/)
        .map(para => {
            // 单个换行变 <br>
            const html = para.trim().replace(/\n/g, '<br>');
            // 如果以 Feature: 或 Benefit: 开头，加左侧色条
            if (html.startsWith('Feature:') || html.startsWith('Benefit:')) {
                const color = html.startsWith('Feature:') ? 'border-blue-400' : 'border-green-400';
                return `<div class="pl-3 ${color} border-l-2">${html}</div>`;
            }
            return `<div>${html}</div>`;
        })
        .join('');
}
</script>
