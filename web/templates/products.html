{% extends "base.html" %}
{% block title %}产品管理 - FT Workspace{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">📦 产品管理</h1>
    <p class="text-sm text-gray-500 mt-1">
        <span id="product-count">{{ products|length }}</span> products
    </p>
</div>

<!-- 搜索栏 (HTMX 实时搜索) -->
<div class="bg-white rounded-xl border border-gray-200 p-4 mb-6">
    <form id="search-form" class="flex gap-3">
        <input type="text" name="q" value="{{ query }}" id="search-input"
               placeholder="搜索产品编码/名称..."
               hx-get="/products/partials/table"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#product-table-container"
               hx-indicator="#search-spinner"
               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none">
        <select name="category" id="category-select"
                hx-get="/products/partials/table"
                hx-trigger="change"
                hx-target="#product-table-container"
                hx-include="#search-input"
                hx-indicator="#search-spinner"
                class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
            <option value="">全部分类</option>
            {% for cat in categories %}
            <option value="{{ cat.category }}" {{ 'selected' if selected_category == cat.category }}>{{ cat.category }} ({{ cat.product_count }})</option>
            {% endfor %}
        </select>
        <div class="relative">
            <button type="button" class="px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors"
                    hx-get="/products/partials/table"
                    hx-target="#product-table-container"
                    hx-include="#search-input, #category-select"
                    hx-indicator="#search-spinner">
                搜索
            </button>
            <!-- HTMX 加载指示器 -->
            <div id="search-spinner" class="htmx-indicator absolute -right-8 top-2">
                <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
        </div>
    </form>
</div>

<!-- 产品表格 (HTMX 替换区域) -->
<div id="product-table-container">
    {% include "components/product_table.html" %}
</div>

<!-- 产品详情弹窗 (HTMX 动态加载) -->
<div id="product-detail-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeModal()"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-xl bg-white shadow-2xl overflow-y-auto">
        <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold" id="modal-title">产品详情</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div id="product-detail-content" class="p-6">
            <!-- HTMX 动态填充 -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function openProductDetail(productCode) {
    const modal = document.getElementById('product-detail-modal');
    modal.classList.remove('hidden');
    document.getElementById('modal-title').textContent = '加载中...';
    document.getElementById('product-detail-content').innerHTML = '<p class="text-gray-400">加载中...</p>';

    fetch(`/products/api/${productCode}`)
        .then(r => r.json())
        .then(p => {
            document.getElementById('modal-title').textContent = p.product_name_en || p.product_code;
            document.getElementById('product-detail-content').innerHTML = `
                <div class="space-y-6">
                    <!-- 基本信息 -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-500 uppercase">编码</label>
                            <p class="text-sm font-medium">${p.product_code}</p>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase">分类</label>
                            <p class="text-sm">${p.category || '-'}</p>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase">材质</label>
                            <p class="text-sm">${p.material || '-'}</p>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase">长度</label>
                            <p class="text-sm">${p.length_cm || '-'} cm</p>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase">重量</label>
                            <p class="text-sm">${p.weight_kg || '-'} kg</p>
                        </div>
                        <div>
                            <label class="text-xs text-gray-500 uppercase">中文名</label>
                            <p class="text-sm">${p.product_name_cn || '-'}</p>
                        </div>
                    </div>

                    <!-- AI 内容生成按钮 -->
                    <div class="border-t border-gray-200 pt-4">
                        <h3 class="text-sm font-semibold text-gray-900 mb-3">🤖 AI 内容生成</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="generateContent('${p.product_code}', 'seo')"
                                    class="px-3 py-2 bg-blue-50 text-blue-700 rounded-lg hover:bg-blue-100 text-sm font-medium"
                                    id="btn-seo">
                                📝 SEO 标题
                            </button>
                            <button onclick="generateContent('${p.product_code}', 'selling_points')"
                                    class="px-3 py-2 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 text-sm font-medium"
                                    id="btn-selling">
                                ✨ 卖点提炼
                            </button>
                            <button onclick="generateContent('${p.product_code}', 'whatsapp')"
                                    class="px-3 py-2 bg-emerald-50 text-emerald-700 rounded-lg hover:bg-emerald-100 text-sm font-medium"
                                    id="btn-whatsapp">
                                💬 WhatsApp 话术
                            </button>
                            <button onclick="generateContent('${p.product_code}', 'alibaba')"
                                    class="px-3 py-2 bg-orange-50 text-orange-700 rounded-lg hover:bg-orange-100 text-sm font-medium"
                                    id="btn-alibaba">
                                🏪 阿里巴巴详情
                            </button>
                        </div>
                        <div id="ai-result" class="mt-4 hidden">
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="flex items-center justify-between mb-2">
                                    <h4 class="text-sm font-medium" id="ai-result-title">结果</h4>
                                    <button onclick="copyAiResult()" class="text-xs text-primary-600 hover:text-primary-800">📋 复制</button>
                                </div>
                                <pre id="ai-result-text" class="text-sm text-gray-700 whitespace-pre-wrap font-sans"></pre>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        })
        .catch(() => {
            document.getElementById('product-detail-content').innerHTML = '<p class="text-red-500">加载失败</p>';
        });
}

function closeModal() {
    document.getElementById('product-detail-modal').classList.add('hidden');
}

function generateContent(productCode, type) {
    const btn = document.getElementById(`btn-${type === 'selling_points' ? 'selling' : type}`);
    const origText = btn.textContent;
    btn.textContent = '⏳ 生成中...';
    btn.disabled = true;

    document.getElementById('ai-result').classList.remove('hidden');
    document.getElementById('ai-result-title').textContent = '生成中...';
    document.getElementById('ai-result-text').textContent = '请稍候，AI 正在生成内容...';

    fetch(`/products/api/${productCode}/generate/${type}`)
        .then(r => r.json())
        .then(data => {
            btn.textContent = origText;
            btn.disabled = false;
            if (data.success) {
                document.getElementById('ai-result-title').textContent = `✅ ${origText.trim()}`;
                const content = typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
                document.getElementById('ai-result-text').textContent = content;
            } else {
                document.getElementById('ai-result-text').textContent = '生成失败: ' + (data.error || '未知错误');
            }
        })
        .catch(err => {
            btn.textContent = origText;
            btn.disabled = false;
            document.getElementById('ai-result-text').textContent = '请求失败: ' + err.message;
        });
}

function copyAiResult() {
    const text = document.getElementById('ai-result-text').textContent;
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
}

// ESC 关闭弹窗
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
});
</script>
{% endblock %}
