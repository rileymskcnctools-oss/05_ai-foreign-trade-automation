{% extends "base.html" %}
{% block title %}开发信 - FT Workspace{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">📧 AI开发信</h1>
    <p class="text-sm text-gray-500 mt-1">根据客户画像生成个性化开发信</p>
</div>

<!-- Tab 切换 -->
<div class="border-b border-gray-200 mb-6">
    <nav class="flex gap-6">
        <button onclick="switchTab('email')" id="tab-email" class="py-2 px-1 border-b-2 border-primary-600 text-primary-600 font-medium text-sm">✉️ 邮件</button>
        <button onclick="switchTab('whatsapp')" id="tab-whatsapp" class="py-2 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 text-sm">📱 WhatsApp</button>
        <button onclick="switchTab('linkedin')" id="tab-linkedin" class="py-2 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 text-sm">🔗 LinkedIn</button>
    </nav>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- 左: 设置 -->
    <div class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="text-lg font-semibold mb-4">设置</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">选择客户</label>
                <select id="outreach-client" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.company_name }} ({{ c.country or 'N/A' }})</option>
                    {% endfor %}
                </select>
            </div>
            <div id="email-options">
                <label class="block text-sm font-medium text-gray-700 mb-1">邮件类型</label>
                <select id="email-type" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                    <option value="cold_intro">Cold Introduction</option>
                    <option value="follow_up">Follow Up</option>
                    <option value="re_engage">Re-engage</option>
                </select>
            </div>
            <button onclick="generateContent()" class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">
                ✨ 生成内容
            </button>
        </div>
    </div>

    <!-- 右: 结果 -->
    <div class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="text-lg font-semibold mb-4">生成结果</h3>
        <div id="outreach-result" class="text-gray-500 text-sm">选择客户后点击生成</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentTab = 'email';
function switchTab(tab) {
    currentTab = tab;
    ['email','whatsapp','linkedin'].forEach(t => {
        document.getElementById('tab-'+t).className = t===tab ? 'py-2 px-1 border-b-2 border-primary-600 text-primary-600 font-medium text-sm' : 'py-2 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 text-sm';
    });
}
async function generateContent() {
    const clientId = document.getElementById('outreach-client').value;
    const resultDiv = document.getElementById('outreach-result');
    resultDiv.innerHTML = '<p class="text-blue-500">⏳ 生成中...</p>';
    const endpoint = currentTab === 'email' ? '/outreach/api/generate-email' : currentTab === 'whatsapp' ? '/outreach/api/generate-whatsapp' : '/outreach/api/generate-linkedin';
    const body = { client_id: parseInt(clientId) };
    if (currentTab === 'email') body.message_type = document.getElementById('email-type').value;
    try {
        const resp = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        const data = await resp.json();
        if (data.error) { resultDiv.innerHTML = '<p class="text-red-500">'+data.error+'</p>'; return; }
        let html = '';
        if (data.subject) html += '<p class="font-medium mb-2">主题: '+data.subject+'</p>';
        html += '<pre class="text-sm bg-gray-50 p-4 rounded whitespace-pre-wrap">'+(data.body||data.message||data.connection_request||JSON.stringify(data,null,2))+'</pre>';
        html += '<button onclick="copyToClipboard(this.previousElementSibling.textContent)" class="mt-2 text-sm text-primary-600 hover:underline">📋 复制</button>';
        resultDiv.innerHTML = html;
        showToast('生成成功!');
    } catch(e) { resultDiv.innerHTML = '<p class="text-red-500">'+e+'</p>'; }
}
</script>
{% endblock %}
