[project]
name = "ft-workspace"
version = "4.0.0"
description = "外贸AI工作台 — 手工农具外贸业务全流程自动化（V4: Vue 3 + FastAPI + SQLite）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # ---- Web 框架 (API 主力) ----
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",              # FastAPI 模板渲染
    # ---- 数据处理 ----
    "pandas>=2.0",
    "openpyxl>=3.1",            # Excel 读写引擎 (read_excel / to_excel)
    # ---- 配置 ----
    "pyyaml>=6.0",
    "python-dotenv>=1.0",       # 加载 config/.env
    # ---- LLM 提供商 (src/core/llm_client.py 按需懒加载) ----
    "openai>=1.0",              # OpenAI 兼容 (DeepSeek / Qwen DashScope)
    "anthropic>=0.30",
    "google-generativeai>=0.7",
    # ---- 网络采集 (src/m8_crm/real_client_finder.py, m4_market_research/web_researcher.py) ----
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",                # bs4 使用的解析器
    # ---- 浏览器自动化 (src/m8_crm/browser_searcher.py, playwright sync API) ----
    # 首次使用需下载内核: playwright install chromium
    "playwright>=1.40",
    # ---- 文档导出 (src/m2_marketing/catalog_generator.py, reports_deai/convert_to_pdf.py) ----
    "fpdf2>=2.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# V2.0 归档 Streamlit 界面：uv sync --extra v2
v2 = ["streamlit>=1.30"]
# 测试依赖（用例待编写，环境先就位）：uv sync --extra dev
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",              # FastAPI TestClient 依赖
]

[tool.pytest.ini_options]
# 测试用例编写后即可直接 `pytest` 运行
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "smoke: 冒烟测试",
    "api: 接口自动化",
    "ui: UI 自动化",
    "unit: 单元测试",
    "slow: 慢用例",
]

# 说明：本项目是应用而非库，不做打包安装；
# 代码通过 PROJECT_ROOT 注入 sys.path 导入 src/ 与 web/。
